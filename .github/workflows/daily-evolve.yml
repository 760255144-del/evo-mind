name: 钱生钱 每日进化

on:
  schedule:
    - cron: '57 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CI: true
      GITHUB_ACTIONS: true
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install chromadb aiosqlite pydantic pydantic-settings \
            typer rich pluggy numpy scipy xxhash tenacity structlog tomli

      - name: 钱生钱进化
        run: python3 daily_evolve.py

      - name: 提交进化数据
        run: |
          git config user.name "钱生钱"
          git config user.email "qianshengqian@evo-mind.ai"
          git add -A
          git diff --staged --quiet || git commit -m "📈 每日进化 [$(date +%Y-%m-%d)]"
          git push || true
