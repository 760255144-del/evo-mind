name: 钱生钱 每日进化

on:
  schedule:
    - cron: '57 0 * * *'   # 每天 UTC 00:57 = 北京时间 8:57
  workflow_dispatch:         # 手动触发
  push:
    branches: [main]         # 每次推送也进化一次

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install chromadb aiosqlite pydantic pydantic-settings \
            typer rich pluggy numpy scipy xxhash tenacity structlog tomli

      - name: 自愈检查
        run: PYTHONPATH=src python3 heal.py || true

      - name: 钱生钱进化
        run: PYTHONPATH=src python3 daily_evolve.py

      - name: 显示状态
        run: PYTHONPATH=src python3 status.py

      - name: 提交进化数据
        run: |
          git config user.name "钱生钱"
          git config user.email "qianshengqian@evo-mind.ai"
          git add -A
          git diff --staged --quiet || git commit -m "📈 每日进化 [$(date +%Y-%m-%d)]"
          git push || true
