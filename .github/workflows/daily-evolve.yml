name: 钱生钱 每日进化

on:
  schedule:
    - cron: '57 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      GITHUB_ACTIONS: true
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v4

      - name: Restore evolution DB cache
        uses: actions/cache@v4
        with:
          path: data/
          key: evo-mind-db-main
          restore-keys: |
            evo-mind-db-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install chromadb aiosqlite pydantic pydantic-settings \
            typer rich pluggy numpy scipy xxhash tenacity structlog tomli \
            sentence-transformers uuid7 || true

      - name: 钱生钱进化
        run: |
          set +e
          mkdir -p evolution_data
          python3 daily_evolve.py
          python3 -c "
          import json, sqlite3
          from pathlib import Path
          try:
              db = sqlite3.connect('data/evo_mind.db')
              mems = db.execute('SELECT COUNT(*) FROM memories WHERE deleted_at IS NULL').fetchone()[0]
              rules = db.execute('SELECT COUNT(*) FROM evolution_rules WHERE status=\"active\"').fetchone()[0]
              db.close()
          except:
              mems, rules = 0, 0
          data = {'date': '\$(date +%Y-%m-%d)', 'memories': mems, 'rules': rules}
          Path('evolution_data').mkdir(exist_ok=True)
          json.dump(data, open(f'evolution_data/\$(date +%Y-%m-%d).json','w'), indent=2)
          print(f'进化记录: {mems} 记忆, {rules} 规则')
          "
          echo "进化完成"

      - name: 提交进化数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "钱生钱"
          git config user.email "qianshengqian@evo-mind.ai"
          git add evolution_data/ || true
          git diff --staged --quiet || git commit -m "📈 进化 [$(date +%Y-%m-%d)]"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/760255144-del/evo-mind.git main || true
