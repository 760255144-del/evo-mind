name: 钱生钱 每日进化

on:
  schedule:
    - cron: '57 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CI: true
      GITHUB_ACTIONS: true
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install chromadb aiosqlite pydantic pydantic-settings \
            typer rich pluggy numpy scipy xxhash tenacity structlog tomli

      - name: 钱生钱进化
        run: |
          mkdir -p evolution_data
          python3 daily_evolve.py
          # Save evolution state to tracked JSON
          python3 -c "
          import json
          from pathlib import Path
          d = Path('evolution_data')
          d.mkdir(exist_ok=True)
          # Count memories in CI data
          import sqlite3
          try:
              db = sqlite3.connect('data/evo_mind.db')
              mems = db.execute('SELECT COUNT(*) FROM memories WHERE deleted_at IS NULL').fetchone()[0]
              rules = db.execute('SELECT COUNT(*) FROM evolution_rules WHERE status=\"active\"').fetchone()[0]
              db.close()
          except:
              mems, rules = 0, 0
          data = {'date': '$(date +%Y-%m-%d)', 'memories': mems, 'rules': rules}
          json.dump(data, open(f'evolution_data/$(date +%Y-%m-%d).json','w'), indent=2)
          print(f'进化记录: {mems} 记忆, {rules} 规则')
          "

      - name: 提交进化数据
        run: |
          git config user.name "钱生钱"
          git config user.email "qianshengqian@evo-mind.ai"
          git add evolution_data/
          git diff --staged --quiet || git commit -m "📈 每日进化 [$(date +%Y-%m-%d)]"
          git push || true
