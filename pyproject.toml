[project]
name = "evo-mind"
version = "0.1.0"
description = "Self-Evolution Memory System for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "evo-mind"}]

dependencies = [
    "chromadb>=0.5.0,<0.7.0",
    "sentence-transformers>=3.0.0",
    "aiosqlite>=0.20.0,<0.22.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "typer>=0.12.0,<0.16.0",
    "rich>=13.0,<15.0",
    "pluggy>=1.4.0,<2.0.0",
    "numpy>=1.26.0,<2.3.0",
    "scipy>=1.12.0,<1.16.0",
    "xxhash>=3.4.0,<4.0.0",
    "uuid7>=0.1.0",
    "tenacity>=8.0,<10.0",
    "structlog>=24.0,<26.0",
    "tomli>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24.0,<0.27.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-mock>=3.14",
    "mypy>=1.10,<2.0",
    "ruff>=0.5.0,<1.0",
    "pre-commit>=3.0,<5.0",
]
all = [
    "torch>=2.0",
    "openai>=1.0,<3.0",
]

[project.scripts]
evo-mind = "evo_mind.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.12"
show_error_codes = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring real embedding model",
    "unit: marks pure unit tests (no IO)",
]
