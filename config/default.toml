[database]
path = "./data/evo_mind.db"
pool_size = 5
busy_timeout_ms = 5000

[chroma]
path = "./data/chroma"
collection_name = "evo_mind_memories"
distance_metric = "cosine"

[embedding]
provider = "local"
model_name = "all-MiniLM-L6-v2"
device = "cpu"
batch_size = 32
cache_size = 10000
normalize = true

[consolidation]
auto_trigger = true
min_candidates = 20
max_candidates_per_run = 500
similarity_threshold = 0.75
dedup_threshold = 0.97
max_total_memories = 100000
min_importance_to_keep = 0.05
default_max_age_days = 90

[evolution]
auto_trigger = true
min_support = 3
min_confidence = 0.6
evaluation_interval_hours = 24

[cli]
theme = "dark"
default_limit = 20
